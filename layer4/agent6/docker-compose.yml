# ──────────────────────────────────────────────────────────────────────────────
# FlashGuard Agent 6 – Local Development Infrastructure
#
# Usage:
#   docker compose up -d          # start all services
#   docker compose down -v        # stop + remove volumes
#
# Services:
#   postgres   → localhost:5432
#   redis      → localhost:6379
#   kafka      → localhost:9092
#   otel-col   → localhost:4317 (gRPC) / 4318 (HTTP)
#   jaeger     → http://localhost:16686  (trace UI)
#   prometheus → http://localhost:9090
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL 16 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: fg_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flashguard
      POSTGRES_PASSWORD: flashguard
      POSTGRES_DB: flashguard
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db_migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis 7 (drop-in compatible with Dragonfly) ────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fg_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Kafka 3.7 (KRaft, no Zookeeper) ──────────────────────────────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: fg_kafka
    restart: unless-stopped
    environment:
      # KRaft (no Zookeeper) – combined broker + controller in one node
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      CLUSTER_ID: "Mk3OEYWSR2yR6zSGW6QpLg"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ── OpenTelemetry Collector ────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    container_name: fg_otel
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml
    ports:
      - "4317:4317"   # gRPC
      - "4318:4318"   # HTTP
      - "8888:8888"   # Collector self-metrics
    depends_on:
      - jaeger

  # ── Jaeger (trace UI) ──────────────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: fg_jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # UI
      - "14250:14250"  # gRPC (legacy)
      # Port 4317 (OTLP gRPC) is used internally by otel-collector → jaeger
      # No host mapping needed; the collector uses container name "jaeger:4317"

  # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: fg_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prom_data:/prometheus
    ports:
      - "9090:9090"

volumes:
  pg_data:
  redis_data:
  kafka_data:
  prom_data:
